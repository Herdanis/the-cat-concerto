# ============================================
# Release on v* tag push
# ============================================
# Generates AI release notes and creates the
# GitHub release. No build artifacts — this
# repo ships prompts and an installer.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        uses: Herdanis/the-invisible-mouse/actions/release-notes@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
